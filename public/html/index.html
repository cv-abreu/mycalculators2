<!DOCTYPE html5>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/png" sizes="32x32" href="/img/icon.png">
        <title>CALCULATOR - cv-abreu</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="/css/style.css">  
    </head>
    <body>
        <h1>CALCULADORA</h1>
    
        <div class="calculator-container">
            <div class="display">
                <input type="text" id="display"  placeholder= "888888888"disabled>
            </div>
            <div class="keyboard">
                <div class="keyboard-numbers">
                    <button class="number" value="7">7</button>
                    <button class="number" value="8">8</button>
                    <button class="number" value="9">9</button>
                    <button class="number" value="4">4</button>
                    <button class="number" value="5">5</button>
                    <button class="number" value="6">6</button>
                    <button class="number" value="1">1</button>
                    <button class="number" value="2">2</button>
                    <button class="number" value="3">3</button>
                    <button class="number" value="0">0</button>
                </div>
                <div class="keyboard-operations">
                    <button class="operation" value="+">+</button>
                    <button class="operation" value="-">-</button>
                    <button class="operation" value="/">/</button>
                    <button class="operation" value="*">*</button>
                    <button id="clear">C</button>
                    <button id="equals">=</button>
                </div>
            </div>

        </div>
        
        <script src="/js/index.js"></script>
        <footer>2025 - criado por @cv-abreu</footer>
    </body>

</html>
